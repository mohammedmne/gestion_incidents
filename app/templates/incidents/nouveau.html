{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Déclarer un incident</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Titre</label>
                        <input type="text" name="titre" class="form-control"
                               placeholder="Ex: Tentative de phishing sur messagerie" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea name="description" class="form-control" rows="4"
                                  placeholder="Décrivez l'incident en détail..." required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Catégorie</label>
                            <select name="categorie" class="form-select" required>
                                <option value="">-- Choisir --</option>
                                <option>Phishing</option>
                                <option>Malware</option>
                                <option>Accès non autorisé</option>
                                <option>Fuite de données</option>
                                <option>Déni de service</option>
                                <option>Ransomware</option>
                                <option>Autre</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Gravité</label>
                            <select name="gravite" class="form-select" required>
                                <option value="">-- Choisir --</option>
                                <option value="faible">Faible</option>
                                <option value="moyen">Moyen</option>
                                <option value="élevé">Élevé</option>
                                <option value="critique">Critique</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <a href="{{ url_for('incidents.dashboard') }}"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Annuler
                        </a>
                        <button type="submit" class="btn btn-dark">
                            <i class="bi bi-send"></i> Déclarer l'incident
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
